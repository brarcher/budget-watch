apply plugin: 'com.android.application'

android {
    compileSdk 37

    defaultConfig {
        applicationId "protect.budgetwatch"
        minSdk 23
        targetSdk 37
        versionCode 30
        versionName "0.22"
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    // Starting with Android Studio 3 Robolectric is unable to find resources.
    // The following allows it to find the resources.
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = "1024m"
            }
        }
    }
    namespace 'protect.budgetwatch'
    lint {
        disable 'GoogleAppIndexingWarning', 'ButtonStyle', 'IconDipSize', 'AlwaysShowAction', 'InflateParams', 'MissingTranslation'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'org.apache.commons:commons-csv:1.5'
    implementation 'com.google.guava:guava:33.8.0-android'
    implementation 'com.github.AppIntro:AppIntro:6.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.robolectric:robolectric:4.18.1"
    testImplementation group: 'org.javatuples', name: 'javatuples', version: '1.2'
}
